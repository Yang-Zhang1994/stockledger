name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stockledger
          MYSQL_USER: stockledger
          MYSQL_PASSWORD: stockledger
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ustockledger -pstockledger"
          --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Apply schema
        run: for f in migrations/*.sql; do mysql -h 127.0.0.1 -ustockledger -pstockledger stockledger < "$f"; done
      - run: go test -tags integration ./internal/eventstore/...
        env:
          MYSQL_DSN: stockledger:stockledger@tcp(127.0.0.1:3306)/stockledger?parseTime=true
      - run: docker build -t stockledger .
      - name: JMeter contention test (no oversell under 50 concurrent clients)
        run: perf/run-jmeter.sh
        env:
          JMETER_TARGET_HOST: localhost
          JMETER_DOCKER_ARGS: --network host

  replenish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replenish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Plan against a live StockLedger
        run: |
          (cd .. && go build -o /tmp/stockledger ./cmd/stockledger)
          /tmp/stockledger -mem -addr :8080 &
          until curl -sf localhost:8080/healthz; do sleep 0.5; done
          python -m replenish seed
          python -m replenish plan | tee plan.txt
          grep -q BRK-PAD-220 plan.txt
