name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stockledger
          MYSQL_USER: stockledger
          MYSQL_PASSWORD: stockledger
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ustockledger -pstockledger"
          --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Apply schema
        run: mysql -h 127.0.0.1 -ustockledger -pstockledger stockledger < migrations/001_events.sql
      - run: go test -tags integration ./internal/eventstore/...
        env:
          MYSQL_DSN: stockledger:stockledger@tcp(127.0.0.1:3306)/stockledger?parseTime=true
      - run: docker build -t stockledger .
